name: adstrackio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adstrackio
      POSTGRES_PASSWORD: adstrackio
      POSTGRES_DB: adstrackio
    ports:
      - "5432:5432"
    volumes:
      - adstrackio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adstrackio -d adstrackio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - adstrackio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adstrackio_postgres_data:
  adstrackio_redis_data:
